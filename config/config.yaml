# Runtime parameters — loaded by AgentRegistry, passed as Graph(config=...).
# Separate from config/agent.yaml (the static manifest).

max_retry: 3
timeout_s: 30

# HITL is NOT required for this agent: MFG is not in the regulated-industry set
# that mandates the interrupt gate, and the agent is advisory-only — the human
# reviewer's approval decision happens entirely outside the agent invocation.
hitl:
  enabled: false
