# Agent Manifest — AgentRegistry entry point
# AgentRegistry reads every key below at ROOT level — do NOT nest keys under an
# `agent:` block. Runtime parameters (max_retry, timeout_s, hitl, ...) live in
# config/config.yaml, which AgentRegistry loads separately.
id: "MFG-C2-140"
name: "Manufacturing Process Validation IQ/OQ/PQ Evidence Gap Agent"
namespace: "mfg"
version: "0.1.0"
enabled: true
category: "Cat 2"
generation_mode: "llm"  # the brief-draft node calls a real LLM outside mock mode
industry: "MFG"

# Opaque compatibility metadata. It is not an inheritance selector or gate input.
base_type: "DocGenerationAgent"

# Entry point — single dotted import path (module.Class).
class: "src.graph.graph.Graph"

# Security
# All nodes in this agent use TrustLevel.ANONYMOUS: no node performs a privileged
# write operation. The /invoke HTTP entry point is separately protected by
# INVOKE_AUTH_TOKEN bearer auth in src/api/server.py, independent of per-node
# trust levels. Keep this value in sync with every node's required_trust_level —
# raise both together if a future node needs elevated trust.
required_trust_level: "ANONYMOUS"

# Compile-time gates — declare every secret/extra actually used.
requires:
  secrets:
    - "AZURE_OPENAI_API_KEY"
    - "AZURE_OPENAI_ENDPOINT"
    - "AZURE_OPENAI_DEPLOYMENT"
  extras: ["openai"]  # BriefDraftNode -> AzureOpenAIClient -> langchain_openai
